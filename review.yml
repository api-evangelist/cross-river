actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The COS API is request/response REST
    with OAuth2 client-credentials auth, and asynchronous delivery is handled by
    HTTP webhooks rather than a server-push WebSocket. No AsyncAPI document was
    created because there is no wss:// transport on Cross River's own API to
    model. An OpenAPI document was authored from the public docs with endpoint
    paths and methods confirmed and body schemas honestly flagged as modeled.
