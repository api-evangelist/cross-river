description: >-
  FinOps view of Cross River Operating System (COS) spend. Cross River is a
  regulated bank offering embedded finance / Banking-as-a-Service; there is no
  public, self-service price list. Program economics are set in a negotiated
  partner agreement and are typically a blend of per-transaction fees (ACH,
  wires, RTP/FedNow), card issuing/processing fees offset by interchange
  revenue share, deposit/servicing arrangements, lending fees, and platform or
  minimum program fees. This makes COS cost management different from
  usage-metered SaaS: the dominant levers are per-rail transaction economics and
  interchange, negotiated commercially rather than published per unit.
notes: >-
  Per-unit rates (transaction fees, interchange splits, deposit terms) are NOT
  reconciled here - they are program-specific and confidential to the partner
  agreement. Confirm the full fee schedule with your Cross River relationship
  manager. Sandbox usage carries no listed charge.
