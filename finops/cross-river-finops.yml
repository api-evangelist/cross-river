meters:
- name: ach_transactions
  description: ACH payments originated/received, typically billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - program
  - account
- name: wire_transactions
  description: Wire transfers sent/received, typically billed per wire.
  unit: transactions
  aggregation: sum
  dimensions:
  - program
  - account
- name: instant_payments
  description: RTP / FedNow / CRNow instant payments, typically billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - program
  - network
- name: card_transactions
  description: Card authorizations/settlements; processing fees offset by interchange revenue share.
  unit: transactions
  aggregation: sum
  dimensions:
  - program
  - card
- name: interchange_revenue
  description: Interchange earned on card programs, shared per the partner agreement (a credit, not a cost).
  unit: usd
  aggregation: sum
  dimensions:
  - program
- name: loans_originated
  description: Loans originated/serviced through the lending module, priced per the agreement.
  unit: loans
  aggregation: sum
  dimensions:
  - program
principles:
- name: Visibility
  description: Track transaction counts and values per rail (ACH, wires, RTP/FedNow), per card program, and per loan to understand where fees accrue.
- name: Allocation
  description: Map COS programs, accounts, and subledgers to internal cost centers so per-rail fees and interchange are attributed to the right product line.
- name: Optimization
  description: Route payments over the most cost-effective rail for each use case, and model interchange revenue share against card processing fees for net card-program economics.
- name: Accountability
  description: Assign owners per program; reconcile monthly Cross River invoices against the negotiated fee schedule and interchange credits.
