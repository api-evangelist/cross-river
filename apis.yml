aid: cross-river
url: https://raw.githubusercontent.com/api-evangelist/cross-river/refs/heads/main/apis.yml
name: Cross River
kind: company
description: Cross River is a regulated bank (FDIC member, Fort Lee, NJ) that delivers
  embedded finance and Banking-as-a-Service (BaaS) through its Cross River Operating
  System (COS) - a collection of REST APIs for deposit accounts, ACH, wires, instant
  payments (RTP, FedNow, CRNow), card issuing and processing, lending, and KYC/customer
  onboarding. Access is partner/enterprise-gated - programs are onboarded through
  Cross River sales and a relationship manager, and OAuth2 client credentials are
  provisioned for sandbox and then production. Endpoints are grounded in the public
  developer documentation at docs.crossriver.com; request/response schemas are
  modeled where the live sandbox is credential-gated.
